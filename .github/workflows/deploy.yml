name: Deploy React App to Pages

on:
  push:
    branches: [ main ] # Triggers the build whenever you push code to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrently:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Compile Build
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Finished Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Vite builds into the dist folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4